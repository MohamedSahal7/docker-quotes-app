services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: quotes-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: quotes-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
